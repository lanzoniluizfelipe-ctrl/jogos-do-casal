<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#18040f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Jogos do Casal 4.2 • +18</title>
<style>
body{margin:0;background:#0d020a;color:#fff;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100dvh}
.box{text-align:center;padding:28px;max-width:300px}
.spin{width:40px;height:40px;border:3px solid rgba(255,61,122,.2);border-top-color:#ff4d8a;border-radius:50%;animation:s .75s linear infinite;margin:0 auto 16px}
@keyframes s{to{transform:rotate(360deg)}}
h1{font-size:1.1rem;margin:0 0 8px}
p{color:#b99aaa;font-size:.8rem;margin:0;line-height:1.4}
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <h1>Jogos do Casal</h1>
  <p id="msg">Carregando…</p>
</div>
<script>
(async function(){
  var msg=document.getElementById('msg'), n=6, parts=[];
  try{
    for(var i=0;i<n;i++){
      var r=await fetch('./d'+i+'.txt');
      if(!r.ok) throw new Error('arquivo '+i);
      parts.push(await r.text());
      msg.textContent='Baixando… '+Math.round((i+1)/n*100)+'%';
    }
    msg.textContent='Abrindo o jogo…';
    var b64=parts.join('');
    var bin=Uint8Array.from(atob(b64),function(c){return c.charCodeAt(0)});
    var stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
    var html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(e){
    msg.textContent='Erro: '+e.message+'. Use Chrome ou Safari atualizado.';
    console.error(e);
  }
})();
</script>
</body>
</html>

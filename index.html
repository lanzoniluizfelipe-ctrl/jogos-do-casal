<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0210">
<link rel="manifest" href="./manifest.webmanifest">
<title>Amor com Putaria</title>
<style>body{margin:0;background:#0d0210;color:#ff6b9d;font-family:system-ui;display:grid;place-items:center;min-height:100dvh;text-align:center;padding:16px}
.bar{width:240px;height:6px;background:#2a1020;border-radius:9px;overflow:hidden;margin:12px auto}.bar i{display:block;height:100%;width:0;background:#ff2d7b}</style>
</head><body>
<p id="m">Carregando…</p><div class="bar"><i id="p"></i></div>
<script>
(async()=>{
const n=5;const parts=[];
try{
for(let i=0;i<n;i++){
const r=await fetch('./s'+i+'.txt?v=3');
if(!r.ok)throw new Error('s'+i+' '+r.status);
parts.push(await r.text());
document.getElementById('p').style.width=((i+1)/n*100)+'%';
}
document.open();document.write(parts.join(''));document.close();
}catch(e){
document.body.innerHTML='<p style="color:#ff6b9d">Erro: '+e.message+'</p><p><a style="color:#ff6b9d" href="./Jogos-do-Casal-4.2%20(1).html">Versão anterior</a></p>';
}
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
